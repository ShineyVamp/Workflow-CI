name: CI Pipeline - MLflow to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install mlflow pandas scikit-learn

    - name: Run MLProject
      run: |
        # Kita sudah berada di root repo, jadi langsung eksekusi MLProject
        mlflow run MLProject/ --env-manager=local

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image using MLflow
      run: |
        # Masuk ke folder MLProject untuk membuild model yang baru dilatih
        cd MLProject
        mlflow models build-docker -m saved_model -n ${{ secrets.DOCKER_USERNAME }}/penguins-model:latest

    - name: Push Docker Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/penguins-model:latest
