name: CI Pipeline - MLflow to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install mlflow pandas scikit-learn

    - name: Run MLProject
      run: |
        mlflow run MLProject/ --env-manager=local

    - name: Save Artifacts to GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add MLProject/saved_model/
        git commit -m "Auto-save trained model artifacts from CI" || echo "No changes to commit"
        git push

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image using MLflow
      run: |
        cd MLProject
        mlflow models build-docker -m saved_model -n ${{ secrets.DOCKER_USERNAME }}/penguins-model:latest

    - name: Push Docker Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/penguins-model:latest
